# Local-first stack — the only mode the backend wires today.
#
#   docker compose up --build
#   open http://localhost:8000/docs
#
# State persists in the `vc_data` named volume (SQLite + filesystem storage).
# A GEMINI/GOOGLE key is optional; without it the API runs but LLM-backed
# endpoints (topics, scripts, SEO, wizard) return a provider error.
#
# For a Postgres-backed single-node deployment use docker-compose.server.yml.
# Full cloud mode (object storage + Redis/Arq worker + nginx) is still pending.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: videocreator-backend:local
    ports:
      - "8000:8000"
    environment:
      APP_MODE: local
      # Pass through a Gemini key if you have one (optional).
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8000"]'
    volumes:
      - vc_data:/data
    restart: unless-stopped

volumes:
  vc_data:
