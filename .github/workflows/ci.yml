name: CI

# Minimal local-first pipeline (Plan Maestro Fase 0 / §C.4): lint + unit.
# Integration, contract, security and e2e stages land with Fase 9 once the
# Docker/testcontainers stack exists. Everything here runs without external
# services, mirroring the zero-docker local mode.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (advisory — not yet a hard gate)
        run: mypy src
        continue-on-error: true

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -m "not integration and not live" -q

  docker:
    name: Docker image build
    needs: unit
    runs-on: ubuntu-latest
    # Build context is the repo root (pyproject reads ../README.md), so the
    # default backend/ working-directory does not apply here.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: videocreator-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
