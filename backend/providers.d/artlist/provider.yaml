id: artlist
name: Artlist Video
version: "1.0.0"
description: Artlist multi-model video generation (sub-routes across catalog models).
capabilities:
  - text_to_video
  - image_to_video
models:
  - id: artlist-auto
    family: artlist
    capabilities: [text_to_video, image_to_video]
    max_duration_s: 30
    max_resolution: [1920, 1080]
    cost: { per_second_usd: 0.05, per_request_usd: 0.0, currency: USD }
    latency: { p50_s: 60.0, p95_s: 240.0, timeout_s: 600.0 }
    strengths: [catalog variety, model sub-routing]
cost: { per_second_usd: 0.05, per_request_usd: 0.0, currency: USD }
latency: { p50_s: 60.0, p95_s: 240.0, timeout_s: 600.0 }
auth:
  vault_key: artlist_api_key
adapter:
  type: python
  entrypoint: adapter.py
tags: [cloud, video, migrated]
